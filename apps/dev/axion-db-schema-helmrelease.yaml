apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: axion-db-schema
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: axion-db-schema
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: acr-helm-repo
        namespace: flux-system
  values:
    environment: dev
    replicaCount: 1
    image:
      repository: postgres
      tag: "16-alpine"
    ingress:
      enabled: false
      className: kong
      hosts:
        - host: dev-db.axion.local
          paths:
            - path: /
              pathType: Prefix
    env:
      POSTGRES_DB: "axion_db"
      POSTGRES_USER: "axion_user"
      POSTGRES_PASSWORD: "Axiondb@1234"
