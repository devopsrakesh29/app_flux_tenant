name: FluxCD Continuous Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to Deploy (dev, int, prod)'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - int
          - prod

env:
  AZURE_CLIENT_ID: "a74bb5f1-70ab-4e43-804f-911563937a5b"
  AZURE_TENANT_ID: "cf95a022-f760-4c81-b527-b8d8a9caddc2"
  AZURE_SUBSCRIPTION_ID: "a60bfb4b-160f-44e7-979b-775bdd787c90"
  AKS_CLUSTER_NAME: "rakesh-aks-cluster"
  AKS_RESOURCE_GROUP: "rakesh-rg"

permissions:
  id-token: write
  contents: read

jobs:
  deploy-flux:
    name: Provision Flux v2 Extension & Sync Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4

      - name: Resolve Target Environment & Dynamic Kustomization
        id: prep
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" == "main" ] || [ "${{ github.ref_name }}" == "master" ]; then
            ENV="prod"
          elif [ "${{ github.ref_name }}" == "int" ]; then
            ENV="int"
          else
            ENV="dev"
          fi
          
          echo "TARGET_ENV=$ENV" >> $GITHUB_ENV
          echo "KUSTOMIZATION_NAME=${ENV}-apps" >> $GITHUB_ENV
          echo "KUSTOMIZATION_PATH=./apps/${ENV}" >> $GITHUB_ENV
          echo "Resolved Target Environment: $ENV"
          echo "Resolved Kustomization Name: ${ENV}-apps"
          echo "Resolved Kustomization Path: ./apps/${ENV}"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Cluster Context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Install Azure CLI k8s-configuration extension
        run: |
          az extension add --name k8s-configuration --upgrade || true
          az extension add --name k8s-extension --upgrade || true

      - name: Wait for Microsoft.Flux Extension Readiness
        shell: bash
        run: |
          echo "Checking Microsoft.Flux extension state on AKS..."
          for i in {1..30}; do
            STATE=$(az k8s-extension show --resource-group ${{ env.AKS_RESOURCE_GROUP }} --cluster-name ${{ env.AKS_CLUSTER_NAME }} --cluster-type managedClusters --name flux --query provisioningState -o tsv 2>/dev/null || echo "NotPresent")
            echo "Current extension state: $STATE"
            if [ "$STATE" == "Succeeded" ] || [ "$STATE" == "NotPresent" ] || [ "$STATE" == "" ]; then
              echo "Microsoft.Flux extension is ready for configuration."
              break
            fi
            echo "Extension is currently in state '$STATE'. Waiting 15 seconds for completion... (Attempt $i/30)"
            sleep 15
          done

      - name: Provision Flux Extension & Configure Target Environment Kustomization on AKS (with Retry)
        shell: bash
        run: |
          for attempt in {1..5}; do
            echo "Attempt $attempt: Creating Flux configuration for environment: ${{ env.TARGET_ENV }}..."
            if az k8s-configuration flux create \
              --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
              --cluster-name ${{ env.AKS_CLUSTER_NAME }} \
              --cluster-type managedClusters \
              --name app-flux-tenant \
              --namespace flux-system \
              --scope cluster \
              --url https://github.com/devopsrakesh29/app_flux_tenant.git \
              --branch ${{ github.ref_name }} \
              --kustomization name=sources path=./sources prune=true sync_interval=1m \
              --kustomization name=${{ env.KUSTOMIZATION_NAME }} path=${{ env.KUSTOMIZATION_PATH }} prune=true sync_interval=5m depends_on=[sources]; then
              echo "Flux v2 GitOps configuration for ${{ env.TARGET_ENV }} created successfully!"
              exit 0
            else
              echo "::warning::Flux configuration creation returned an error. Waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          echo "Failed to create Flux configuration after 5 attempts."
          exit 1

      - name: Verify FluxCD Extension & Cluster Status
        run: |
          kubectl get namespaces
          kubectl get pods -n flux-system
          kubectl get kustomizations -n flux-system
          kubectl get helmreleases -n ${{ env.TARGET_ENV }}
