name: FluxCD Continuous Deployment Pipeline

on:
  push:
    branches: [ main, master, dev, int ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to Deploy (dev, int, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - int
          - prod

env:
  AZURE_CLIENT_ID: "a74bb5f1-70ab-4e43-804f-911563937a5b"
  AZURE_TENANT_ID: "cf95a022-f760-4c81-b527-b8d8a9caddc2"
  AZURE_SUBSCRIPTION_ID: "a60bfb4b-160f-44e7-979b-775bdd787c90"
  AKS_CLUSTER_NAME: "rakesh-aks-cluster"
  AKS_RESOURCE_GROUP: "rakesh-rg"

permissions:
  id-token: write
  contents: read

jobs:
  deploy-flux:
    name: Sync FluxCD Manifests to AKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4

      - name: Resolve Target Environment
        id: prep
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" == "main" ] || [ "${{ github.ref_name }}" == "master" ]; then
            ENV="prod"
          elif [ "${{ github.ref_name }}" == "int" ]; then
            ENV="int"
          else
            ENV="dev"
          fi
          
          echo "TARGET_ENV=$ENV" >> $GITHUB_ENV
          echo "Target deployment environment resolved to: $ENV"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Cluster Context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Deploy Flux Namespaces & Core Sources to AKS
        run: |
          kubectl apply -f 00-flux-system-namespace.yaml
          kubectl apply -f sources/

      - name: Deploy Environment Specific Flux Apps to AKS
        run: |
          echo "Deploying manifests for environment: ${{ env.TARGET_ENV }}..."
          kubectl apply -f apps/${{ env.TARGET_ENV }}/

      - name: Verify FluxCD Deployment Status for Environment
        run: |
          kubectl get namespaces
          kubectl get kustomizations -n flux-system
          kubectl get helmreleases -n ${{ env.TARGET_ENV }}
