name: FluxCD Continuous Deployment Pipeline

on:
  push:
    branches: [ main, master, dev, int ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to Deploy (dev, int, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - int
          - prod

env:
  AZURE_CLIENT_ID: "a74bb5f1-70ab-4e43-804f-911563937a5b"
  AZURE_TENANT_ID: "cf95a022-f760-4c81-b527-b8d8a9caddc2"
  AZURE_SUBSCRIPTION_ID: "a60bfb4b-160f-44e7-979b-775bdd787c90"
  AKS_CLUSTER_NAME: "rakesh-aks-cluster"
  AKS_RESOURCE_GROUP: "rakesh-rg"

permissions:
  id-token: write
  contents: read

jobs:
  deploy-flux:
    name: Provision Flux v2 Extension & Sync Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4

      - name: Resolve Target Environment
        id: prep
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" == "main" ] || [ "${{ github.ref_name }}" == "master" ]; then
            ENV="prod"
          elif [ "${{ github.ref_name }}" == "int" ]; then
            ENV="int"
          else
            ENV="dev"
          fi
          
          echo "TARGET_ENV=$ENV" >> $GITHUB_ENV
          echo "Target deployment environment resolved to: $ENV"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Cluster Context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Install Azure CLI k8s-configuration extension
        run: |
          az extension add --name k8s-configuration --upgrade || true

      - name: Provision Flux Extension & Configure GitOps Kustomizations on AKS
        run: |
          az k8s-configuration flux create \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --cluster-name ${{ env.AKS_CLUSTER_NAME }} \
            --cluster-type managedClusters \
            --name app-flux-tenant \
            --namespace flux-system \
            --scope cluster \
            --url https://github.com/devopsrakesh29/app_flux_tenant.git \
            --branch main \
            --kustomization name=sources path=./sources prune=true sync_interval=1m \
            --kustomization name=dev-apps path=./apps/dev prune=true sync_interval=5m depends_on=[sources] \
            --kustomization name=int-apps path=./apps/int prune=true sync_interval=5m depends_on=[sources] \
            --kustomization name=prod-apps path=./apps/prod prune=true sync_interval=5m depends_on=[sources]

      - name: Verify FluxCD Extension & Cluster Status
        run: |
          kubectl get namespaces
          kubectl get pods -n flux-system
